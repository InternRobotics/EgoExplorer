<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ego_data 30Hz 三联复核</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e9ef;--dim:#8b93a3;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--accent:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:15px;font-weight:600}
.meta{color:var(--dim);font-size:12px}
.meta b{color:var(--fg)}
#bar{padding:8px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
input[type=range]{flex:1;min-width:220px}
#tm{font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap}
main{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.pane h2{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:600;display:flex;justify-content:space-between}
video,canvas{width:100%;background:#07090d;border-radius:6px;display:block}
#view{aspect-ratio:4/3}
.tac{grid-column:1/-1}
.tacgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.hand{background:#0b0d12;border-radius:8px;padding:8px}
.hand h3{margin:0 0 6px;font-size:12px;color:var(--accent);font-weight:600}
svg.handsvg{width:100%;max-width:300px;margin:0 auto;display:block}
.frow{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:11px}
.fname{width:62px;color:var(--dim)}
.fbar{flex:1;height:12px;background:#161a22;border-radius:3px;overflow:hidden;position:relative}
.fbar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#22d3ee)}
.fbar u{position:absolute;top:0;bottom:0;width:2px;background:var(--warn)}
.fval{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.status{color:var(--dim);font-size:11px;margin-top:6px}
.warnbox{background:#33301c;border:1px solid #4a4327;color:#e8d9a0;border-radius:8px;padding:8px 10px;margin:0 16px 10px;font-size:12px;line-height:1.7}
@media(max-width:900px){main{grid-template-columns:1fr}.tacgrid{grid-template-columns:1fr}}
</style></head><body>
<header>
  <h1 id="title">加载中…</h1>
  <div class="meta" id="meta"></div>
</header>
<div class="warnbox" id="notes"></div>
<div id="bar">
  <button id="play">播放</button>
  <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
  <input id="frame" type="range" min="0" step="1" value="0">
  <span id="tm"></span>
  <label style="color:var(--dim)"><input type="checkbox" id="follow" checked> 相机跟随</label>
  <button id="reset">重置视角</button>
</div>
<main>
  <div class="pane" id="vpane"><h2><span>① 视频（GoPro）</span><span id="vinfo"></span></h2>
    <video id="vid" preload="auto" muted playsinline></video></div>
  <div class="pane"><h2><span>② SMPL-X Mesh（含手指）</span><span id="minfo"></span></h2>
    <canvas id="view"></canvas></div>
  <div class="pane tac"><h2><span>③ 触觉 · L4 二值接触（17 分区手形图）</span><span id="tinfo"></span></h2>
    <div class="tacgrid">
      <div class="hand"><h3>左手 L</h3><div id="tacL"></div></div>
      <div class="hand"><h3>右手 R</h3><div id="tacR"></div></div>
    </div>
    <canvas id="strip" height="190" style="margin-top:10px"></canvas>
    <div class="status" id="tstatus"></div>
  </div>
</main>
<script>
const P = /*__PAYLOAD__*/null, MESH_URL = /*__MESH__*/'', FACES_URL = /*__FACES__*/'', VIDEO_URL = /*__VIDEO__*/'';
const $ = id => document.getElementById(id);
const vid = $('vid'), slider = $('frame'), canvas = $('view');
let faces, meshBuf, meshPos, meshFrame = -1, frame = 0, playing = false, playWall = 0, playTime = 0;
let az = Math.PI, el = 0.18, dist = 3.0, target = [0, 0, 0.85], drag = false, px = 0, py = 0;

$('title').textContent = P.session;
// The file is named by an ASCII slug -- Chrome refuses to load media whose
// filename carries the task name -- so the tab title is where the full name,
// task and 恢复 suffix included, has to show up.
document.title = P.session + ' · 三联复核';
$('meta').innerHTML = `<b>${P.frames}</b>/${P.source_frames} 帧 · <b>${P.rate_hz}</b> Hz · 手套 <b>${P.glove_layout}</b> · 手部来源 <b>${P.hand_pose_source}</b> · tracker 原生 <b>${P.tracker_native_hz}</b> Hz · 上采样 <b>${P.upsample_ratio}×</b>`;
const notes = [];
if (P.upsample_ratio > 1.2) notes.push(`⚠ <b>上采样 ${P.upsample_ratio}×</b>：tracker 原生只有 ${P.tracker_native_hz} Hz，30 Hz 输出里约 ${Math.round((1 - 1 / P.upsample_ratio) * 100)}% 的帧是按时间戳插值出来的（不是测量值）。`);
if (P.has_body !== false && P.hand_pose_source !== 'glove_fused')
  notes.push('⚠ <b>手部为中性零姿态占位</b>，不是测量值。');
if (P.tactile) notes.push('触觉按项目自有的 <b>L0→L4</b> 管线计算（定义见 <code>wuji_correct.py</code>）：L1 减 10 秒滚动 p10 基线，L2 除稳健 MAD 得 z，L3 按 taxel 健康度做增益补偿，<b>L4</b> 取区域 80 分位后走双判据迟滞（z&gt;8 且残差&gt;0.030 置位，z&lt;4 或残差&lt;0.015 释放，最短 0.05 s）。黄色=接触。');
notes.push(`本视图为 ${P.frames} 帧均匀抽样（原 ${P.source_frames} 帧），仅用于复核；时间戳为真实值。`);
$('notes').innerHTML = notes.join('<br>');
slider.max = P.frames - 1;
function missingVideo() {
  // Either the recording has no video at all, or its 360p file is not beside
  // this page yet -- the transcodes land asynchronously, so the page is written
  // to reference the mp4 and find out at load time whether it arrived.
  if (!document.getElementById('vid')) return;
  vid.remove();
  $('vpane').insertAdjacentHTML('beforeend',
    '<div class="status" style="padding:18px">360p mp4 尚未生成或不可用。<br>mesh 与触觉不受影响。</div>');
  $('vinfo').textContent = P.video
    ? `原生 ${P.video.native_hz} Hz · ${P.video.frame_count} 帧（无 mp4）` : '无视频';
}
if (P.video && VIDEO_URL) {
  vid.onerror = missingVideo;
  // A媒体 response that was cached before the file was re-encoded keeps Chrome
  // reporting the video as unseekable, so force a fresh fetch each load.
  vid.src = VIDEO_URL + (VIDEO_URL.includes('?') ? '&' : '?') + 'r=' + Date.now();
  vid.onloadedmetadata = () => {
    const ratio = vid.duration / P.video.wall_span_s;
    $('vinfo').textContent = `原生 ${P.video.native_hz} Hz · ${P.video.frame_count} 帧 · mp4 ${vid.duration.toFixed(2)}s / 墙钟 ${P.video.wall_span_s.toFixed(2)}s`;
    if (Math.abs(ratio - 1) > 0.02) {
      $('notes').insertAdjacentHTML('beforeend',
        `<br>⚠ <b>该 mp4 内部时间轴与墙钟不一致</b>（${vid.duration.toFixed(2)}s vs ${P.video.wall_span_s.toFixed(2)}s，比值 ${ratio.toFixed(3)}）——已改为按帧号定位，不受影响。`);
    }
    show(frame);
  };
  $('vinfo').textContent = `原生 ${P.video.native_hz} Hz`;
}
else { missingVideo(); }

gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
const ebo = gl.createBuffer();

  const proj = new Float32Array([f * h / w, 0, 0, 0, 0, f, 0, 0, 0, 0, (fa + n) / (n - fa), -1, 0, 0, 2 * fa * n / (n - fa), 0]);
  const eye = [target[0] + dist * Math.cos(el) * Math.sin(az), target[1] + dist * Math.cos(el) * Math.cos(az), target[2] + dist * Math.sin(el)];
  const fw = [target[0] - eye[0], target[1] - eye[1], target[2] - eye[2]];

async function gunzip(url) {

function render() {

function show(f) {

    unpack(frame);

    render();

    // own duration instead of seeking by elapsed seconds.
    const step = vid.duration / Math.max(P.video.frame_count - 1, 1);
    vid.currentTime = P.video.frame_index[frame] * step;
    vtxt = ` · 视频帧 ${P.video.frame_index[frame]}/${P.video.frame_count - 1}（栅格偏差 ${P.video.offset_ms[frame]} ms）`;
  }

  if (P.has_body !== false) $('minfo').textContent = `${P.vertex_count} 顶点`;
  if (P.tactile) {
    const coarse = (side) => (P.tactile[side] ? P.coarse_names.filter((_, i) => P.tactile[side].coarse[frame][i] === 1) : []);
    $('tstatus').textContent = `粗分区接触　左: ${coarse('L').join(',') || '无'}　右: ${coarse('R').join(',') || '无'}`;

canvas.onpointerdown = e => { drag = true; px = e.clientX; py = e.clientY; canvas.setPointerCapture(e.pointerId); };

canvas.onwheel = e => { e.preventDefault(); dist = Math.max(0.6, Math.min(12, dist * Math.exp(e.deltaY * 0.001))); render(); };

$('reset').onclick = () => { az = Math.PI; el = 0.18; dist = 3.0; $('follow').checked = true; show(frame); };

  if (playing) {

    if (f + 1 >= P.frames && want > P.time[P.frames - 1]) { show(0); playTime = 0; playWall = now; }

(async function init() {

    // video and tactile panes live -- they are what you need in order to see
    // what the projection choked on.
    const f = P.failure || {};
    const label = {diverged: '投影发散', proposal: '提案阶段失败', contact: 'contact 长度不匹配',
                   pending: '尚未处理'}[f.kind] || '未产出';
    document.getElementById('view').remove();

      `<div class="status" style="padding:20px;line-height:1.9">
         <b style="color:#f87171;font-size:14px">无 SMPL-X：${label}</b><br>
         ${f.why || ''}<br><br>

    ? '<b style="color:#fbbf24;font-size:15px">需要通过 HTTP 打开</b><br>'

      + 'mesh 文件就在旁边，没有丢。<br><br>'
      + '<code style="user-select:all;color:#60a5fa">cd 这个包的根目录 &amp;&amp; python3 serve.py 18110</code><br><br>'
